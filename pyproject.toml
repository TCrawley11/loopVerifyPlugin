[project]
name = "loopverify"
version = "0.0.1"
description = "Loop with your agents as a teammate while a verification layer judges the work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
lverify = "loopverify.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopverify"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=2.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["loopverify", "plugin"]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["plugins.*", "tools.*"]
ignore_missing_imports = true
